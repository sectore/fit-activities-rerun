name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: fmt
        run: nix develop --command just fmt-check-rs

      - name: clippy
        run: nix develop --command just lint-rs

      - name: build
        run: nix develop --command just build-rs

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: fmt
        run: nix develop --command just fmt-check-py

      - name: lint
        run: nix develop --command just lint-py

      - name: typecheck-py
        run: nix develop --command just typecheck-py

      - name: build
        run: nix develop --command just build-py
